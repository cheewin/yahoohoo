app = "yahoohoo"
primary_region = "iad"

[build]
  dockerfile = "../Dockerfile"

[env]
  YAHOOHOO_TRANSPORT = "http"
  YAHOOHOO_HOST = "0.0.0.0"
  YAHOOHOO_PORT = "8080"
  YAHOOHOO_LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
